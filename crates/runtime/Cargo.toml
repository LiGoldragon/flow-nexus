[package]
name = "flow-nexus-runtime"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = []
datom = ["dep:datom-codec", "flow-nexus-types/datom"]

[dependencies]
rkyv.workspace = true
datom-codec = { workspace = true, optional = true }
flow-nexus-types.workspace = true
flow-nexus-platform.workspace = true
memory = { git = "https://github.com/LiGoldragon/memory", rev = "bfdde49897d060ce29f962ee35bdfaed3b50dd6b" }
kameo = "0.22"

tokio = { version = "1", features = ["sync", "rt"] }
