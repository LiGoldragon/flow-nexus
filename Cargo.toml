[workspace]
resolver = "2"
members = ["crates/core", "crates/daemon", "crates/translator", "crates/emission"]

[workspace.package]
edition = "2021"
rust-version = "1.89"

[workspace.dependencies]
signal-flow-nexus-version-1 = { git = "https://github.com/LiGoldragon/signal-flow-nexus", rev = "79197996d37800feb04c6a1b03e64e2c85ca31b7", default-features = false }
signal = { git = "https://github.com/LiGoldragon/signal", rev = "0cad1d1aeddec7da2971dc88e964320a6db48c20", default-features = false }
