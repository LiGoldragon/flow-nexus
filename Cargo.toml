[workspace]
resolver = "2"
members = ["crates/core", "crates/daemon", "crates/translator", "crates/emission", "crates/wire"]

[workspace.package]
edition = "2021"
rust-version = "1.89"

[workspace.dependencies]
signal-flow-nexus-version-1 = { git = "https://github.com/LiGoldragon/signal-flow-nexus", rev = "b470959cdcbdac39f1908a3e1b9a4a2f03b41463", default-features = false }
signal = { git = "https://github.com/LiGoldragon/signal", rev = "0cad1d1aeddec7da2971dc88e964320a6db48c20", default-features = false }
shared-translator = { package = "translator", git = "https://github.com/LiGoldragon/translator", rev = "751c326f11c874b527a69ce6377ce9e196aeca37", default-features = false, features = ["unix"] }
signal-belief-nexus = { git = "https://github.com/LiGoldragon/signal-belief-nexus", rev = "ccfa452bf1b807c9f180a4cae70318e66afb9a11", default-features = false }
signal-herdr-nexus = { git = "https://github.com/LiGoldragon/signal-herdr-nexus", rev = "8d78cd8dcdab228c67b6d471969eecb43c6fd68b", default-features = false }
herdr-nexus-wire = { git = "https://github.com/LiGoldragon/herdr-nexus", rev = "cce12214cc13182eb462257606c963631779f99b", default-features = false }
